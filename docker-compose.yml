version: '3.8'

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite:////app/data/app.db
    volumes:
      - backend-data:/app/data
    working_dir: /app

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  backend-data:
